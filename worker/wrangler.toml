name = "mlpu-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# Variables públicas (no secretas) para el historial de ML (Módulo 1).
[vars]
SELLER_ID = "283388639"
ML_SITE_ID = "MLC"
# IG User ID de la cuenta Business (se obtiene en la puesta en marcha, Task 7).
IG_USER_ID = "17841476463162844"
PUBLIC_URL = "https://mlpu-proxy.aronricocl.workers.dev"
# Cloud name de la cuenta Cloudinary (plan free): eslabón principal de la
# cadena de imágenes IG (mismo blur + banner pero sin CPU del Worker, que en
# plan Free corta el compositor propio con error 1102). Vacío = se salta.
CLOUDINARY_CLOUD = ""

# KV: almacena la sesión OAuth de ML (access_token + refresh_token).
# Crear con:  wrangler kv namespace create ML_TOKENS
# y pegar el id devuelto abajo.
[[kv_namespaces]]
binding = "ML_TOKENS"
id = "1f6324c3659d4388bec284825c2864be"

# KV: órdenes de ML (estado de venta + tracking) para el bot de Telegram.
[[kv_namespaces]]
binding = "ML_ORDERS"
id = "d72bf35159b54eabadffafc521c1562b"

# D1: cola y config de Instagram (MLPU-Instagram).
[[d1_databases]]
binding = "DB"
database_name = "mlpu-db"
database_id = "5145a70c-1c25-4904-a63a-4021b3bd19db"

# Crons de MLPU-Instagram: cada minuto corre el publisher (tandas cortas y
# confiables; en rush eso da subida continua ~2 ítems/min hasta llenar el cupo
# diario; en goteo/ventanas los ticks sobrantes salen gratis tras 1-2 reads de
# D1). 0 10 UTC = ventanas del día + renovación del token de Meta. El scheduler
# post-venta sigue APAGADO (scheduled() ya no lo invoca; ver index.js).
[triggers]
crons = ["* * * * *", "0 10 * * *"]

# Secrets (NO van aquí, configurar con):
#   wrangler secret put ML_CLIENT_ID
#   wrangler secret put ML_CLIENT_SECRET
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID

# Assets estáticos (imagen de la historia promocional /ig promo).
# Con `main` presente, los paths que matchean un asset se sirven directo;
# el resto sigue yendo al fetch handler de index.js.
[assets]
directory = "./public"
binding = "ASSETS"
